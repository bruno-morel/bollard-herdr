onboarding = false
[theme]
name = "terminal"
[terminal]
default_shell = "@HOME@/.local/bin/repo-tui-shell"
shell_mode = "non_login"
[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
pane_gaps = false
[keys]
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
new_worktree = ""
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "$HOME/.local/bin/repo-tui command tools"
[[keys.command]]
key = "prefix+i"
type = "shell"
command = "$HOME/.local/bin/repo-tui command info"
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "$HOME/.local/bin/repo-tui command change"
